<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Französisch Vokabeltrainer</title>
<style>*{box-sizing:border-box}body{margin:0;background:#f6f7fb;color:#172033;font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif}.app{max-width:520px;margin:auto;min-height:100vh;background:white}header{padding:10px 14px 6px;border-bottom:1px solid #e7e9ef;position:sticky;top:0;background:#fff;z-index:2}.top{display:flex;justify-content:space-between;align-items:center;gap:8px}h1{font-size:17px;margin:0}.score{font-size:12px;color:#667085}.progress{height:5px;background:#edf0f5;border-radius:5px;margin:7px 0;overflow:hidden}.bar{height:100%;background:#172033;width:0}.tabs{display:grid;grid-template-columns:1fr 1fr;gap:4px;background:#f0f2f6;padding:3px;border-radius:9px}.tab{border:0;background:transparent;padding:7px;border-radius:7px;font-weight:650}.tab.active{background:white;box-shadow:0 1px 3px #0002}main{padding:10px 14px 20px}.controls{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:9px}select{width:100%;padding:8px;border:1px solid #d7dbe4;border-radius:8px;background:white}.card{border:1px solid #e1e4eb;border-radius:14px;padding:16px;box-shadow:0 4px 14px #1018280b}.small{font-size:12px;color:#667085}.word{font-size:28px;font-weight:750;margin:12px 0 16px}.options{display:grid;gap:8px}.option,.primary,.secondary{padding:11px 12px;border-radius:10px;border:1px solid #d7dbe4;background:white;text-align:left;font-size:15px}.option.correct{background:#eaf8ef;border-color:#87c99e}.option.wrong{background:#fff0f0;border-color:#e3a2a2}.primary{background:#172033;color:white;text-align:center;width:100%;margin-top:10px}.secondary{text-align:center;width:100%}.lesson{display:flex;align-items:center;gap:10px;padding:12px 4px;border-bottom:1px solid #eceef2}.lesson input{width:18px;height:18px}.lesson-title{font-weight:650}.lesson-count{font-size:12px;color:#667085}.summary{padding:10px 12px;background:#f6f7fb;border-radius:10px;margin-bottom:8px;font-size:13px}.hidden{display:none}.answer{font-size:25px;font-weight:700;margin:15px 0}@media(min-width:600px){.app{margin-top:20px;min-height:auto;border:1px solid #e5e7eb;border-radius:16px;overflow:hidden}}</style></head>
<body><div class="app"><header><div class="top"><h1>Französisch</h1><div class="score" id="score">0 richtig · 0 falsch</div></div><div class="progress"><div class="bar" id="bar"></div></div><div class="tabs"><button class="tab active" id="learnTab">Lernen</button><button class="tab" id="lessonTab">Lektionen</button></div></header><main><section id="learn"><div class="controls"><select id="direction"><option value="de-fr">DE → FR</option><option value="fr-de">FR → DE</option></select><select id="mode"><option value="choice">Auswahl</option><option value="think">Denken</option></select></div><div class="card"><div class="small" id="meta"></div><div class="word" id="prompt"></div><div id="choiceBox" class="options"></div><div id="thinkBox" class="hidden"><button class="secondary" id="reveal">Lösung zeigen</button><div id="answer" class="answer hidden"></div><div id="judge" class="hidden controls"><button class="secondary" id="wrongBtn">Noch üben</button><button class="secondary" id="rightBtn">Gewusst!</button></div></div><button id="next" class="primary hidden">Nächste Karte</button></div></section><section id="lessons" class="hidden"><div class="summary" id="summary"></div><label class="lesson"><input type="checkbox" id="allLessons" checked><div><div class="lesson-title">Alle Lektionen</div><div class="lesson-count">gesamten Wortschatz lernen</div></div></label><div id="lessonList"></div></section></main></div>
<script>
const DATA={"lektionen":[{"id":1,"name":"Unité 1 – Volet 1","vokabeln":[{"de":"das Schloss","fr":"le château / les châteaux"},{"de":"ein Elefant","fr":"un éléphant"},{"de":"die Maschine","fr":"la machine"},{"de":"eine Insel","fr":"une île"},{"de":"das Stadtzentrum","fr":"le centre-ville"},{"de":"der Skatepark","fr":"le skatepark"},{"de":"das Gebäude","fr":"le bâtiment"},{"de":"das Haus","fr":"la maison"},{"de":"das Bauwerk, das Denkmal","fr":"le monument"},{"de":"ein Kunstwerk","fr":"une œuvre d’art"},{"de":"der Hafen","fr":"le port"},{"de":"die Brücke","fr":"le pont"},{"de":"der Fluss","fr":"le fleuve"},{"de":"der Platz","fr":"la place"},{"de":"die Fußgängerzone","fr":"la rue piétonne"},{"de":"die Straßenbahn","fr":"le tram"},{"de":"eine Haltestelle, ein Halt","fr":"un arrêt"},{"de":"die Kreuzung","fr":"le carrefour"},{"de":"jdn./etw. vorstellen","fr":"présenter qn/qc"},{"de":"der, die, das","fr":"qui"},{"de":"er/sie/es befindet sich, er/sie/es liegt","fr":"il/elle se trouve"},{"de":"etw. durchqueren, etw. überqueren","fr":"traverser qc"},{"de":"berühmt","fr":"célèbre"},{"de":"ein Autor / eine Autorin","fr":"un auteur / une auteure"},{"de":"die Reise","fr":"le voyage"},{"de":"außergewöhnlich","fr":"extraordinaire"},{"de":"wo","fr":"où"},{"de":"die Spezialität","fr":"la spécialité"},{"de":"der Rundgang, die Strecke","fr":"le parcours"},{"de":"der/die Jugendliche","fr":"le/la jeune"},{"de":"ausgehen, hinausgehen","fr":"sortir"},{"de":"chillen","fr":"chiller"},{"de":"ein Baum","fr":"un arbre"},{"de":"Tischtennis","fr":"le ping-pong"},{"de":"sie befinden sich, sie liegen","fr":"ils/elles se trouvent"},{"de":"geboren (sein)","fr":"(être) né/née"},{"de":"losgehen, wegfahren","fr":"partir"},{"de":"am Wochenende wegfahren","fr":"partir en week-end"},{"de":"das Fahrrad","fr":"le vélo"},{"de":"mit dem Fahrrad","fr":"à vélo"},{"de":"das Schiff, das Boot","fr":"le bateau / les bateaux"},{"de":"modern","fr":"moderne"},{"de":"der Kanal","fr":"la chaîne"},{"de":"hier: über","fr":"sur"}]}]};
const lessons=DATA.lektionen;let selected=new Set(lessons.map(l=>l.id)),pos=0,correct=0,wrong=0,locked=false;const $=id=>document.getElementById(id);function words(){return lessons.filter(l=>selected.has(l.id)).flatMap(l=>l.vokabeln.map(v=>({...v,lesson:l.name})))}function shuffle(a){return [...a].sort(()=>Math.random()-.5)}let order=shuffle(words());function reset(){order=shuffle(words());pos=0;locked=false;render()}function card(){return order.length?order[pos%order.length]:null}function render(){const c=card();$('choiceBox').innerHTML='';$('next').classList.add('hidden');$('answer').classList.add('hidden');$('judge').classList.add('hidden');$('reveal').classList.remove('hidden');locked=false;if(!c){$('prompt').textContent='Keine Lektion ausgewählt';return}const rev=$('direction').value==='fr-de',prompt=rev?c.fr:c.de,answer=rev?c.de:c.fr;$('meta').textContent=c.lesson;$('prompt').textContent=prompt;if($('mode').value==='choice'){$('choiceBox').classList.remove('hidden');$('thinkBox').classList.add('hidden');const pool=shuffle(words().filter(x=>x!==c).map(x=>rev?x.de:x.fr)).slice(0,3);shuffle([answer,...pool]).forEach(o=>{const b=document.createElement('button');b.className='option';b.textContent=o;b.onclick=()=>choose(b,o===answer,answer);$('choiceBox').appendChild(b)})}else{$('choiceBox').classList.add('hidden');$('thinkBox').classList.remove('hidden');$('answer').textContent=answer}updateScore()}function choose(btn,ok,answer){if(locked)return;locked=true;if(ok){correct++;btn.classList.add('correct')}else{wrong++;btn.classList.add('wrong');[...$('choiceBox').children].find(b=>b.textContent===answer)?.classList.add('correct')}$('next').classList.remove('hidden');updateScore()}function updateScore(){$('score').textContent=`${correct} richtig · ${wrong} falsch`;const n=correct+wrong;$('bar').style.width=(n?Math.round(correct/n*100):0)+'%'}$('next').onclick=()=>{pos++;render()};$('reveal').onclick=()=>{$('answer').classList.remove('hidden');$('judge').classList.remove('hidden');$('reveal').classList.add('hidden')};$('rightBtn').onclick=()=>{correct++;pos++;render()};$('wrongBtn').onclick=()=>{wrong++;pos++;render()};$('direction').onchange=render;$('mode').onchange=render;function tab(which){$('learn').classList.toggle('hidden',which!=='learn');$('lessons').classList.toggle('hidden',which!=='lessons');$('learnTab').classList.toggle('active',which==='learn');$('lessonTab').classList.toggle('active',which==='lessons')}$('learnTab').onclick=()=>tab('learn');$('lessonTab').onclick=()=>tab('lessons');function lessonUI(){$('lessonList').innerHTML='';lessons.forEach(l=>{let lab=document.createElement('label');lab.className='lesson';let cb=document.createElement('input');cb.type='checkbox';cb.checked=selected.has(l.id);cb.onchange=()=>{if(cb.checked)selected.add(l.id);else if(selected.size>1)selected.delete(l.id);else cb.checked=true;$('allLessons').checked=selected.size===lessons.length;summary();reset()};let d=document.createElement('div');d.innerHTML=`<div class="lesson-title">${l.name}</div><div class="lesson-count">${l.vokabeln.length} Vokabeln</div>`;lab.append(cb,d);$('lessonList').append(lab)});summary()}function summary(){$('summary').textContent=`${selected.size} von ${lessons.length} Lektionen · ${words().length} Vokabeln ausgewählt`}$('allLessons').onchange=()=>{selected=new Set(lessons.map(l=>l.id));lessonUI();reset()};lessonUI();render();
</script></body></html>
