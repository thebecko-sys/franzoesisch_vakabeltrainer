<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Französisch Vokabeltrainer</title>
<style>
*{box-sizing:border-box}button,select{font:inherit}body{margin:0;background:linear-gradient(145deg,#f5f8ff 0%,#fff8f3 48%,#f4fbf6 100%);color:#17231c;font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif}.app{max-width:520px;margin:auto;min-height:100dvh}.flag{display:flex;height:6px;margin:10px 14px 4px;overflow:hidden;border-radius:999px;box-shadow:0 1px 3px #314a7422}.flag span{flex:1}.flag span:nth-child(1){background:#3f6fc4}.flag span:nth-child(2){background:#fff}.flag span:nth-child(3){background:#ea5b59}header{padding:8px 14px 8px;position:sticky;top:0;background:#f9fbffed;backdrop-filter:blur(10px);z-index:2}.top{display:flex;justify-content:space-between;align-items:center;gap:8px}h1{font-size:18px;margin:0;font-weight:850;letter-spacing:-.02em}.score{font-size:12px;color:#536157;font-weight:700}.progress{height:6px;background:#e4e7e3;border-radius:6px;margin:8px 0;overflow:hidden}.bar{height:100%;background:linear-gradient(90deg,#3f6fc4,#e6543f);width:0;transition:width .25s}.tabs{display:grid;grid-template-columns:1fr 1fr;gap:4px;background:#e9e8e4;padding:3px;border-radius:11px}.tab{border:0;background:transparent;padding:8px;border-radius:8px;font-size:13px;font-weight:800;color:#657069}.tab.active{background:white;color:#315796;box-shadow:0 1px 4px #263d6922}main{padding:10px 14px 24px}.controls{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:10px}select{width:100%;min-height:40px;padding:8px 10px;border:1px solid #d9dff0;border-radius:10px;background:#fff;color:#315796;font-size:13px;font-weight:750}.card{position:relative;overflow:hidden;border:1px solid #d9dff0;border-radius:24px;padding:17px;background:#fff;box-shadow:0 16px 42px #2e42701f}.card:before{content:"";position:absolute;right:0;top:0;width:94px;height:94px;border-radius:0 0 0 100%;background:#ffe1d8aa;pointer-events:none}.small,.word,.options,.card>button,.answer,.card>.controls,.feedback{position:relative}.small{font-size:12px;color:#667085;font-weight:650}.word{font-size:28px;font-weight:850;letter-spacing:-.02em;margin:15px 0 18px}.options{display:grid;gap:9px}.option,.primary,.secondary{min-height:49px;padding:11px 13px;border-radius:13px;border:2px solid #d9dff0;background:#f8faff;text-align:left;font-size:15px;font-weight:750;transition:transform .12s,background .12s,border-color .12s}.option:active,.secondary:active{transform:scale(.985)}.option.correct{background:#e3f4e8;border-color:#45a96b;color:#1f6038}.option.wrong{background:#fbe7e3;border-color:#df614f;color:#8f3027}.option:disabled{opacity:1}.primary{background:#315796;color:white;text-align:center;width:100%;margin-top:10px;border-color:#315796}.secondary{text-align:center;width:100%;background:#fff}.feedback{display:flex;align-items:center;justify-content:center;min-height:49px;margin-top:11px;padding:10px 12px;border:1px solid;border-radius:13px;text-align:center;font-size:14px;font-weight:850}.feedback.correct{background:#dff3e6;border-color:#83c79b;color:#21613a}.feedback.wrong{background:#fde8e4;border-color:#e4aaa0;color:#94382d}.grade-heading{display:flex;align-items:center;justify-content:space-between;margin:14px 0 5px;padding:8px 10px;border-radius:11px;background:#eaf0fc;color:#315796;font-size:13px;font-weight:850}.grade-heading span{font-size:11px}.lesson{display:flex;align-items:center;gap:10px;padding:13px 4px;border-bottom:1px solid #e2e6ef}.lesson input{width:20px;height:20px;accent-color:#315796}.lesson-title{font-weight:750}.lesson-count{font-size:12px;color:#667085}.summary{padding:11px 12px;background:#eaf0fc;border-radius:11px;margin-bottom:8px;font-size:13px;color:#315796;font-weight:700}.hidden{display:none!important}.answer{font-size:25px;font-weight:800;margin:15px 0;padding:14px;border-radius:13px;background:#e3f4e8;text-align:center}@media(min-width:600px){.app{margin-top:18px;min-height:auto}.card{padding:20px}}
</style></head>
<body><div class="app"><div class="flag" aria-hidden="true"><span></span><span></span><span></span></div><header><div class="top"><h1>Bonjour, les mots!</h1><div class="score" id="score">0 richtig · 0 falsch</div></div><div class="progress"><div class="bar" id="bar"></div></div><div class="tabs"><button class="tab active" id="learnTab">Lernen</button><button class="tab" id="lessonTab">Lektionen</button></div></header><main><section id="learn"><div class="controls"><select id="direction" aria-label="Abfragerichtung"><option value="de-fr">DE → FR</option><option value="fr-de">FR → DE</option></select><select id="mode" aria-label="Lernmodus"><option value="think" selected>Karteikarten</option><option value="choice">Auswahl</option></select></div><div class="card"><div class="small" id="meta"></div><div class="word" id="prompt"></div><div id="choiceBox" class="options"></div><div id="thinkBox" class="hidden"><button class="secondary" id="reveal">Lösung zeigen</button><div id="answer" class="answer hidden"></div><div id="judge" class="hidden controls"><button class="secondary" id="wrongBtn">Noch üben</button><button class="secondary" id="rightBtn">Gewusst!</button></div></div><div id="feedback" class="feedback hidden" role="status" aria-live="polite"></div></div></section><section id="lessons" class="hidden"><div class="summary" id="summary"></div><label class="lesson"><input type="checkbox" id="allLessons" checked><div><div class="lesson-title">Alle Lektionen</div><div class="lesson-count">gesamten Wortschatz lernen</div></div></label><div id="lessonList"></div></section></main></div>
<script>
const DATA={"lektionen":[{"id":1,"grade":7,"name":"Unité 1 – Volet 1","vokabeln":[{"de":"das Schloss","fr":"le château / les châteaux"},{"de":"ein Elefant","fr":"un éléphant"},{"de":"die Maschine","fr":"la machine"},{"de":"eine Insel","fr":"une île"},{"de":"das Stadtzentrum","fr":"le centre-ville"},{"de":"der Skatepark","fr":"le skatepark"},{"de":"das Gebäude","fr":"le bâtiment"},{"de":"das Haus","fr":"la maison"},{"de":"das Bauwerk, das Denkmal","fr":"le monument"},{"de":"ein Kunstwerk","fr":"une œuvre d’art"},{"de":"der Hafen","fr":"le port"},{"de":"die Brücke","fr":"le pont"},{"de":"der Fluss","fr":"le fleuve"},{"de":"der Platz","fr":"la place"},{"de":"die Fußgängerzone","fr":"la rue piétonne"},{"de":"die Straßenbahn","fr":"le tram"},{"de":"eine Haltestelle, ein Halt","fr":"un arrêt"},{"de":"die Kreuzung","fr":"le carrefour"},{"de":"jdn./etw. vorstellen","fr":"présenter qn/qc"},{"de":"der, die, das","fr":"qui"},{"de":"er/sie/es befindet sich, er/sie/es liegt","fr":"il/elle se trouve"},{"de":"etw. durchqueren, etw. überqueren","fr":"traverser qc"},{"de":"berühmt","fr":"célèbre"},{"de":"ein Autor / eine Autorin","fr":"un auteur / une auteure"},{"de":"die Reise","fr":"le voyage"},{"de":"außergewöhnlich","fr":"extraordinaire"},{"de":"wo","fr":"où"},{"de":"die Spezialität","fr":"la spécialité"},{"de":"der Rundgang, die Strecke","fr":"le parcours"},{"de":"der/die Jugendliche","fr":"le/la jeune"},{"de":"ausgehen, hinausgehen","fr":"sortir"},{"de":"chillen","fr":"chiller"},{"de":"ein Baum","fr":"un arbre"},{"de":"Tischtennis","fr":"le ping-pong"},{"de":"sie befinden sich, sie liegen","fr":"ils/elles se trouvent"},{"de":"geboren (sein)","fr":"(être) né/née"},{"de":"losgehen, wegfahren","fr":"partir"},{"de":"am Wochenende wegfahren","fr":"partir en week-end"},{"de":"das Fahrrad","fr":"le vélo"},{"de":"mit dem Fahrrad","fr":"à vélo"},{"de":"das Schiff, das Boot","fr":"le bateau / les bateaux"},{"de":"modern","fr":"moderne"},{"de":"der Kanal","fr":"la chaîne"},{"de":"hier: über","fr":"sur"}]}]};
const lessons=DATA.lektionen;
let selected=new Set(lessons.map(l=>l.id)),pos=0,correct=0,wrong=0,locked=false,advanceTimer=null;
const $=id=>document.getElementById(id);
function words(){return lessons.filter(l=>selected.has(l.id)).flatMap(l=>l.vokabeln.map(v=>({...v,lesson:l.name})))}
function shuffle(a){return [...a].sort(()=>Math.random()-.5)}
let order=shuffle(words());
function reset(){clearTimeout(advanceTimer);order=shuffle(words());pos=0;locked=false;render()}
function card(){return order.length?order[pos%order.length]:null}
function render(){
  clearTimeout(advanceTimer);advanceTimer=null;
  const c=card();
  $('choiceBox').innerHTML='';
  $('feedback').classList.add('hidden');
  $('feedback').classList.remove('correct','wrong');
  $('answer').classList.add('hidden');
  $('judge').classList.add('hidden');
  $('reveal').classList.remove('hidden');
  locked=false;
  if(!c){$('prompt').textContent='Keine Lektion ausgewählt';return}
  const rev=$('direction').value==='fr-de',prompt=rev?c.fr:c.de,answer=rev?c.de:c.fr;
  $('meta').textContent=`${c.lesson} · Karte ${pos+1} / ${order.length}`;
  $('prompt').textContent=prompt;
  if($('mode').value==='choice'){
    $('choiceBox').classList.remove('hidden');$('thinkBox').classList.add('hidden');
    const pool=shuffle(words().filter(x=>x!==c).map(x=>rev?x.de:x.fr)).slice(0,3);
    shuffle([answer,...pool]).forEach(o=>{const b=document.createElement('button');b.className='option';b.textContent=o;b.onclick=()=>choose(b,o===answer,answer);$('choiceBox').appendChild(b)})
  }else{
    $('choiceBox').classList.add('hidden');$('thinkBox').classList.remove('hidden');$('answer').textContent=answer
  }
  updateScore()
}
function choose(btn,ok,answer){
  if(locked)return;
  locked=true;
  [...$('choiceBox').children].forEach(b=>b.disabled=true);
  if(ok){correct++;btn.classList.add('correct')}else{wrong++;btn.classList.add('wrong');[...$('choiceBox').children].find(b=>b.textContent===answer)?.classList.add('correct')}
  const feedback=$('feedback');
  feedback.textContent=ok?'✓ Richtig! Nächste Vokabel kommt gleich …':'× Leider falsch. Nächste Vokabel kommt gleich …';
  feedback.classList.add(ok?'correct':'wrong');
  feedback.classList.remove('hidden');
  updateScore();
  advanceTimer=setTimeout(()=>{pos++;render()},2000)
}
function updateScore(){$('score').textContent=`${correct} richtig · ${wrong} falsch`;const n=correct+wrong;$('bar').style.width=(n?Math.round(correct/n*100):0)+'%'}
$('reveal').onclick=()=>{$('answer').classList.remove('hidden');$('judge').classList.remove('hidden');$('reveal').classList.add('hidden')};
$('rightBtn').onclick=()=>{correct++;pos++;render()};
$('wrongBtn').onclick=()=>{wrong++;pos++;render()};
$('direction').onchange=render;
$('mode').onchange=render;
function tab(which){$('learn').classList.toggle('hidden',which!=='learn');$('lessons').classList.toggle('hidden',which!=='lessons');$('learnTab').classList.toggle('active',which==='learn');$('lessonTab').classList.toggle('active',which==='lessons')}
$('learnTab').onclick=()=>tab('learn');
$('lessonTab').onclick=()=>tab('lessons');
function lessonUI(){$('lessonList').innerHTML='';[...new Set(lessons.map(l=>l.grade))].sort((a,b)=>a-b).forEach(grade=>{const gradeLessons=lessons.filter(l=>l.grade===grade);let heading=document.createElement('div');heading.className='grade-heading';heading.innerHTML=`<strong>${grade}. Klasse</strong><span>${gradeLessons.length} ${gradeLessons.length===1?'Lektion':'Lektionen'}</span>`;$('lessonList').append(heading);gradeLessons.forEach(l=>{let lab=document.createElement('label');lab.className='lesson';let cb=document.createElement('input');cb.type='checkbox';cb.checked=selected.has(l.id);cb.onchange=()=>{if(cb.checked)selected.add(l.id);else if(selected.size>1)selected.delete(l.id);else cb.checked=true;$('allLessons').checked=selected.size===lessons.length;summary();reset()};let d=document.createElement('div');d.innerHTML=`<div class="lesson-title">${l.name}</div><div class="lesson-count">${l.vokabeln.length} Vokabeln</div>`;lab.append(cb,d);$('lessonList').append(lab)})});summary()}
function summary(){$('summary').textContent=`${selected.size} von ${lessons.length} Lektionen · ${words().length} Vokabeln ausgewählt`}
$('allLessons').onchange=()=>{selected=new Set(lessons.map(l=>l.id));lessonUI();reset()};
lessonUI();render();
</script></body></html>
